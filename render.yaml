services:
  - type: web
    name: wax64-shell
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
    routes:
      - type: rewrite
        source: /
        destination: /wax64.html
